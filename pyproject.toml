[project]
name = "foresight"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "timesfm[torch]>=3.0.2",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
